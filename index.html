<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teamily Android UI — M3 Prototypes</title>
<style>
  :root{
    --bg:#0b0d12; --surface:#141821; --surface2:#1b2130; --line:#252c3b;
    --text:#e8ecf4; --muted:#8b95a9; --accent:#7c9cff; --accent2:#5eead4;
    --chip:#1e2534;
  }
  html[data-theme="light"]{
    --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f9; --line:#dde4f0;
    --text:#131722; --muted:#5b6577; --accent:#3b5bdb; --accent2:#0d9488;
    --chip:#eef2f9;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:48px 20px 72px}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 46px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:19px;color:#0b0d12;letter-spacing:-.5px;
  }
  h1{margin:0;font-size:26px;letter-spacing:-.4px}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
  .theme-btn{
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600;
  }
  .theme-btn:hover{background:var(--surface2)}
  .meta{
    margin:28px 0 8px;display:flex;gap:10px;flex-wrap:wrap;
  }
  .chip{
    background:var(--chip);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:12.5px;color:var(--muted);font-weight:600;
  }
  .chip b{color:var(--text)}
  h2{margin:36px 0 14px;font-size:15px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  a.card{
    display:block;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;transition:transform .12s ease,border-color .12s ease,background .12s ease;
  }
  a.card:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--surface2)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .vname{font-weight:700;font-size:16px;letter-spacing:-.2px}
  .badge{
    font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);
    border:1px solid var(--line);white-space:nowrap;
  }
  .badge.latest{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0d12;border-color:transparent}
  .desc{margin:9px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
  /* "Last updated" sits under the description, above the path, so the card
     reads: preview -> name -> what changed -> when -> where. */
  .updated{margin:9px 0 0;display:flex;align-items:center;gap:6px;font-size:12px;
    font-weight:600;color:var(--muted);letter-spacing:.1px}
  .updated svg{width:13px;height:13px;flex:0 0 13px;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .updated time{font-variant-numeric:tabular-nums}
  .path{margin:11px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);opacity:.75}
  /* The commit that last touched this version's folder, so a card can be
     traced to the exact build it shows. Same monospace voice as the path. */
  .sha{margin:6px 0 0;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);opacity:.85}
  .sha code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
    background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--text)}
  .sha .sha-lbl{letter-spacing:.02em}
  /* Live thumbnail: the version's own page, scaled down inside a fixed box.
     The iframe is 4x the box and transform-scaled to 25%, so the prototype
     renders at its real layout width instead of a squeezed mobile viewport. */
  .thumb{
    position:relative;margin:0 0 13px;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface2);
    aspect-ratio:16/10;
  }
  .thumb iframe{
    position:absolute;top:0;left:0;width:1200px;height:750px;border:0;
    transform:scale(.25);transform-origin:0 0;pointer-events:none;
    background:#fff;
  }
  .thumb .ph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;
  }
  .thumb.loaded .ph{display:none}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">M3</div>
      <div>
        <h1>Teamily Android UI — M3 Prototypes</h1>
        <p class="sub">Interactive Material 3 prototype versions, newest first.</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">Switch to light</button>
  </header>

  <div class="meta">
    <span class="chip"><b id="vcount">25</b> versions</span>
    <span class="chip">Repo <b>KRFbrothers/teamily-android-ui</b></span>
    <span class="chip">Served from <b>main</b></span>
  </div>

  <h2>Prototype versions</h2>
  <div class="grid" id="grid"></div>

  <footer>
    Source: <a href="https://github.com/KRFbrothers/teamily-android-ui">github.com/KRFbrothers/teamily-android-ui</a>
    &nbsp;·&nbsp; Pages: <a href="https://krfbrothers.github.io/teamily-android-ui/">krfbrothers.github.io/teamily-android-ui</a>
  </footer>
</div>

<script>
/* The version list is data, so adding a version is one line here. `dir` is the
   folder under webpages/; the link is that folder's own index.html. */
var VERSIONS = [
  { dir: 'm3-prototype_v25', name: 'v25', latest: true, date: '2026-11-16', sha: '4092e76',
    desc: 'Sign out confirm karne ke baad poora app read-only: ek dimmed/blurred veil poore phone ko dhak leta hai aur ek capture-phase guard har click, typing, keyboard aur drag cancel karta hai \u2014 sirf \u201cSign back in\u201d chalta hai, us pe tap se state reset ho kar app pehle jaisa chalu.' },
  { dir: 'm3-prototype_v24', name: 'v24', date: '2026-11-16', sha: '4092e76',
    desc: 'Settings ke top pe search field jo rows filter karta hai \u2014 group headings sirf tab dikhte hain jab us group me match ho, kuch match na ho to saaf \u201cno results\u201d state, clear karne pe poori list wapas. Sign out ke baad \u201cSign back in\u201d button jo state reset karta hai.' },
  { dir: 'm3-prototype_v23', name: 'v23', date: '2026-11-16', sha: '4092e76',
    desc: 'Profile ke teeno stat tiles tappable \u2014 CHATS / AGENTS / ARTIFACTS pe tap karne se usi ka list screen khulta hai (live data ke saath), aur Back se Profile pe wapas.' },
  { dir: 'm3-prototype_v22', name: 'v22', date: '2026-11-16', sha: 'bd2193e',
    desc: 'Profile ke CHATS / AGENTS / ARTIFACTS ab live data se aate hain (create ya delete karne pe number turant badalta hai), aur \u201cSign out\u201d Profile se hata kar Settings \u2192 Profile & Device me shift \u2014 confirm dialog ke saath, sirf ek hi jagah.' },
  { dir: 'm3-prototype_v21', name: 'v21', date: '2026-11-16', sha: 'f24f391',
    desc: 'Saare settings ek hi jagah: Profile ke Quick Actions se Appearance / Storage / Notifications hata kar Settings list me shift \u2014 Profile me sirf ek \u201cSettings\u201d entry point, koi duplicate row nahi.' },
  { dir: 'm3-prototype_v20', name: 'v20', date: '2026-11-15', sha: '0ba0395',
    desc: 'Unread pill pe tap karne se us channel ka unread clear (reload ke baad bhi), ek \u201cMark all as read\u201d row, aur drag ke waqt drop-indicator line halka pulse karti hai.' },
  { dir: 'm3-prototype_v19', name: 'v19', date: '2026-11-15', sha: '24ff350',
    desc: 'Channels screen pe har channel ka unread count (last-message stamp ke saath), aur drag ke waqt ek \u201cdrop here\u201d indicator line jahan row drop hogi.' },
  { dir: 'm3-prototype_v18', name: 'v18', date: '2026-11-15', sha: '55a7356',
    desc: 'Channels screen ke channels bhi drag-to-reorder (same lift + saved order), aur har channel row pe uska \u201clast message\u201d timestamp.' },
  { dir: 'm3-prototype_v17', name: 'v17', date: '2026-11-15', sha: '8525f25',
    desc: 'Dedicated \u201cChannels for Dua Agent\u201d screen behind the Settings row, and every Settings row now wears the same mint cube-family tile.' },
  { dir: 'm3-prototype_v16', name: 'v16', date: '2026-11-15', sha: '826cd4d',
    desc: 'Settings’ “Channels for Dua Agent” row now wears the app’s own cube logo, and Dua mode’s composer reads “Ask Dua Gen AI…”.' },
  { dir: 'm3-prototype_v15', name: 'v15', date: '2026-11-15', sha: 'bfd8cc8',
    desc: 'Branding pass: app name is Dua Gen AI, tabs are Dua / Agent, cube logo kept — screens stay demo.' },
  { dir: 'm3-prototype_v14', name: 'v14', date: '2026-11-15', sha: '75d08bc',
    desc: 'Haptic-style lift while dragging a connector row: scale + shadow + a short vibrate tick, with the rows it passes easing aside (FLIP).' },
  { dir: 'm3-prototype_v13', name: 'v13', date: '2026-11-15', sha: '4165f71',
    desc: 'Undo toast after Disconnect all + drag-to-reorder connectors with a persisted order.' },
  { dir: 'm3-prototype_v12', name: 'v12', date: '2026-11-15', sha: '479d542',
    desc: 'Restores the v9 live connected-app count in the Disconnect all dialog and row, on top of v11.' },
  { dir: 'm3-prototype_v11', name: 'v11', date: '2026-11-15', sha: '5a29c22',
    desc: 'Clear recents action in the Recently used heading + recents cap raised to 10.' },
  { dir: 'm3-prototype_v10', name: 'v10', date: '2026-11-15', sha: 'eb7106d',
    desc: 'Suggested apps orders recently used first.' },
  { dir: 'm3-prototype_v9', name: 'v9', date: '2026-11-15', sha: 'b4d6e55',
    desc: 'Live connected-app count in the Disconnect all confirm dialog.' },
  { dir: 'm3-prototype_v8', name: 'v8', date: '2026-11-15', sha: 'fd7467f',
    desc: 'Disconnect all confirm dialog + Suggested apps section.' },
  { dir: 'm3-prototype_v7', name: 'v7', date: '2026-11-15', sha: 'c6e569c',
    desc: 'Disconnect all row + Add connector search.' },
  { dir: 'm3-prototype_v6', name: 'v6', date: '2026-11-15', sha: '4fd129b',
    desc: 'Connector pill state persists + Add connector screen.' },
  { dir: 'm3-prototype_v5', name: 'v5', date: '2026-11-15', sha: 'd978adb',
    desc: 'App Connectors pills toggle Connected <-> Connect.' },
  { dir: 'm3-prototype_v4', name: 'v4', date: '2026-11-15', sha: 'd589d7a',
    desc: 'Create tiles open their own screens + Settings sub-screens.' },
  { dir: 'm3-prototype_v3', name: 'v3', date: '2026-11-15', sha: '784ff54',
    desc: 'Quick Actions sheet, header + menu, public profile & settings.' },
  { dir: 'm3-prototype_v2', name: 'v2', date: '2026-11-15', sha: '9d63721',
    desc: 'M3 interactive prototype with screen-list sidebar.' },
  { dir: 'M3-design_v01', name: 'v01', date: '2026-11-14', sha: '32eac3c',
    desc: 'Cube logo replaces the old Teamily bot badge (header, avatars, badges).' }
];

/* "2026-11-15" -> "15 Nov 2026". Built from the parts, not `new Date(str)`,
   so the date can never shift a day in a timezone behind UTC. */
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length !== 3) return iso;
  return (+p[2]) + ' ' + MONTHS[(+p[1]) - 1] + ' ' + p[0];
}
var CAL_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/>' +
  '<path d="M8 3v4M16 3v4M3 10h18"/></svg>';

(function () {
  var grid = document.getElementById('grid');
  var html = '';
  for (var i = 0; i < VERSIONS.length; i++) {
    var v = VERSIONS[i];
    html += '<a class="card" href="webpages/' + v.dir + '/index.html">' +
      '<div class="thumb" data-thumb="webpages/' + v.dir + '/index.html">' +
        '<span class="ph">Loading preview\u2026</span></div>' +
      '<div class="card-top"><span class="vname">' + v.name + '</span>' +
      (v.latest ? '<span class="badge latest">Latest</span>' : '<span class="badge">Prototype</span>') +
      '</div>' +
      '<p class="desc">' + v.desc + '</p>' +
      (v.date ? '<p class="updated">' + CAL_ICON + '<span>Updated <time datetime="' + v.date + '">' +
        fmtDate(v.date) + '</time></span></p>' : '') +
      (v.sha ? '<p class="sha"><span class="sha-lbl">commit</span><code>' + v.sha + '</code></p>' : '') +
      '<p class="path">webpages/' + v.dir + '/index.html</p>' +
      '</a>';
  }
  grid.innerHTML = html;
  document.getElementById('vcount').textContent = VERSIONS.length;

  /* Each thumbnail is the version's real page in an iframe, loaded only when
     the card scrolls into view \u2014 13 full prototypes at once would be far too
     heavy. `pointer-events:none` keeps the card's own link clickable. */
  var thumbs = grid.querySelectorAll('[data-thumb]');
  function loadThumb(box) {
    if (box.getAttribute('data-done')) return;
    box.setAttribute('data-done', '1');
    var f = document.createElement('iframe');
    f.setAttribute('loading', 'lazy');
    f.setAttribute('tabindex', '-1');
    f.setAttribute('aria-hidden', 'true');
    f.setAttribute('scrolling', 'no');
    f.src = box.getAttribute('data-thumb');
    f.addEventListener('load', function () {
      box.classList.add('loaded');
      // The prototype page opens on its own hero, and its phones sit far to the
      // right of the page's left margin. The box only shows the iframe's
      // top-left 300x188 (the 1200x750 frame at 25%), so neither scrolling nor
      // offsetting alone frames the phone. Do both:
      //   vertical  -> scroll the iframe so the phone's top is near the top
      //   horizontal-> offset the frame left by the phone's own left x scale
      // The first phone on every version is Dua mode — deliberately an empty
      // body plus the composer — so prefer the first Agent-mode phone (the chat
      // list), falling back to the first phone if a version has none.
      try {
        var w = f.contentWindow, d = f.contentDocument;
        if (w && d) {
          var ph = d.querySelector('[data-phone][data-mode="agent"]') ||
                   d.querySelector('[data-phone]');
          if (ph) {
            var s = 0.25, pad = 16;
            var r0 = ph.getBoundingClientRect();
            w.scrollTo(0, Math.max(0, r0.top + w.scrollY - pad));
            var r = ph.getBoundingClientRect();
            f.style.left = (-(r.left - pad) * s) + 'px';
          }
        }
      } catch (e) {}
    });
    box.appendChild(f);
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) { loadThumb(entries[i].target); io.unobserve(entries[i].target); }
      }
    }, { rootMargin: '200px' });
    for (var ti = 0; ti < thumbs.length; ti++) io.observe(thumbs[ti]);
  } else {
    for (var tj = 0; tj < thumbs.length; tj++) loadThumb(thumbs[tj]);
  }

  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var stored = null;
  try { stored = localStorage.getItem('m3-index-theme'); } catch (e) {}
  if (stored === 'dark' || stored === 'light') root.setAttribute('data-theme', stored);
  function label() {
    btn.textContent = root.getAttribute('data-theme') === 'dark' ? 'Switch to light' : 'Switch to dark';
  }
  label();
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('m3-index-theme', next); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
