# Builds the debug APK and publishes it as a GitHub Release asset.
#
# Why a Release and not an artifact: the account's Actions artifact storage
# quota is exhausted, so `actions/upload-artifact` fails. Release assets are
# stored against the release, not the run, and are not subject to that quota.
# There is deliberately NO upload-artifact step in this file.
#
# Every run publishes a NEW release under a NEW tag (`debug-apk-<run_number>`).
# Existing releases and tags are never moved, overwritten or force-pushed: if
# the tag already exists the job fails instead of clobbering it.
#
# No signing secret is needed. `assembleDebug` signs with the throwaway debug
# keystore that AGP generates inside the runner, which is exactly what a debug
# APK is. Nothing is committed and no keystore is stored in this repo.

name: Debug APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release assets are written with the run's own token, so the job needs write
# access to repository contents. Nothing else is required.
permissions:
  contents: write

# One release per push. Do not cancel a run that is already publishing, or a
# half-created release could be left behind.
concurrency:
  group: debug-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # JDK 17 matches `compileOptions` / `kotlinOptions.jvmTarget` in
      # app/build.gradle.kts.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the Android SDK for compileSdk 34 (app/build.gradle.kts).
      # v3 tries to install the legacy `tools` package by default, which the
      # current sdkmanager no longer has ("Failed to find package 'tools'"),
      # so the step failed. v4 with an explicit package list avoids that.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 34 & Build-Tools 34.0.0
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Caches the Gradle 8.7 distribution and dependency jars between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Fails loudly if the APK is not where AGP is expected to put it, so a
      # silent build change cannot produce an empty release.
      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          ASSET="dua-debug-${SHORT_SHA}.apk"
          cp "$APK" "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ASSET")" >> "$GITHUB_OUTPUT"
          echo "Built $ASSET ($(du -h "$ASSET" | cut -f1))"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.apk.outputs.asset }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail

          TAG="debug-apk-${GITHUB_RUN_NUMBER}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Never reuse a tag: a new run must produce a new release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          cat > release-notes.md <<EOF
          Debug APK built from \`main\`.

          | | |
          |---|---|
          | Commit | \`${FULL_SHA}\` |
          | Short SHA | \`${SHORT_SHA}\` |
          | Built at | ${BUILT_AT} |
          | Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |
          | APK size | ${APK_SIZE} bytes |

          **Install:** \`adb install -r ${ASSET}\`

          This is a **debug** build, signed with the throwaway debug keystore
          generated on the runner. It is not a release build and must not be
          distributed as one.
          EOF

          gh release create "$TAG" "$ASSET" \
            --target "$FULL_SHA" \
            --title "Debug APK ${SHORT_SHA} (run #${GITHUB_RUN_NUMBER})" \
            --notes-file release-notes.md

          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
