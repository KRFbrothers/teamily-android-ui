name: Android Debug APK & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dua_api_base_url:
        description: 'Optional override for DUA_API_BASE_URL (Node API)'
        required: false
        default: ''
      dua_engine_base_url:
        description: 'Optional override for DUA_ENGINE_BASE_URL (Python AI Engine)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-apk:
    name: Run Robolectric tests & build app-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 34 & Build-Tools 34.0.0
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit & Compose UI tests (Robolectric)
        env:
          DUA_API_BASE_URL: ${{ inputs.dua_api_base_url }}
          DUA_ENGINE_BASE_URL: ${{ inputs.dua_engine_base_url }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Upload unit test report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble Debug APK
        env:
          DUA_API_BASE_URL: ${{ inputs.dua_api_base_url }}
          DUA_ENGINE_BASE_URL: ${{ inputs.dua_engine_base_url }}
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2

      - name: Verify APK output & write SHA-256 summary
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE=$(du -h "$APK_PATH" | awk '{print $1}')
          {
            echo "### Debug APK Ready"
            echo "- **File:** \`app-debug.apk\`"
            echo "- **Size:** \`$SIZE\`"
            echo "- **SHA-256:** \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable app-debug.apk artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
