# JVM args for the Gradle daemon. Tuned for local build and Compose preview speed.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Build caching, parallel execution, and configuration caching for fast incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required by every dependency in this project.
android.useAndroidX=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# Keep the build deterministic: no R class for non-transitive deps.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
