# JVM args for the Gradle daemon. 2 GB is enough for this single-module app and
# keeps the build inside a small CI container.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only what was asked for.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by every dependency in this project.
android.useAndroidX=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# Keep the build deterministic: no R class for non-transitive deps.
android.nonTransitiveRClass=true
