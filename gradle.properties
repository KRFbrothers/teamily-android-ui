# JVM args for the Gradle daemon. This is a single-module app, so a 1.5 GB heap
# is plenty. It also keeps the build inside a small CI container: on a 2 GB box
# -Xmx2048m leaves no room for metaspace and native memory, and the daemon gets
# OOM-killed, which surfaces as "Gradle build daemon disappeared unexpectedly".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Build only what was asked for.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by every dependency in this project.
android.useAndroidX=true

# Kotlin code style for the IDE.
kotlin.code.style=official

# Keep the build deterministic: no R class for non-transitive deps.
android.nonTransitiveRClass=true
